name: Send automation email

on:
  workflow_dispatch:
    inputs:
      recipient_email:
        description: "E-mailadres van de ontvanger"
        required: true
        type: string
      subject:
        description: "Onderwerp"
        required: true
        default: "AuraWash administratie update"
        type: string
      body:
        description: "Bericht"
        required: true
        type: string
      reply_to:
        description: "Reply-to e-mailadres"
        required: false
        type: string

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Send email
        run: node scripts/send-email.mjs
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          EMAIL_TO: ${{ inputs.recipient_email }}
          EMAIL_SUBJECT: ${{ inputs.subject }}
          EMAIL_BODY: ${{ inputs.body }}
          EMAIL_REPLY_TO: ${{ inputs.reply_to }}
