name: Inbox automation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

jobs:
  sync-and-remind:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync inbox and run reminders
        run: npm run automation:run
        env:
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_PORT: ${{ secrets.IMAP_PORT }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASS: ${{ secrets.IMAP_PASS }}
          IMAP_MAILBOX: ${{ secrets.IMAP_MAILBOX }}
          INBOX_SINCE_DAYS: ${{ vars.INBOX_SINCE_DAYS || '45' }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          EMAIL_REPLY_TO: ${{ secrets.EMAIL_REPLY_TO }}
          PAYABLE_REMINDER_DAYS: ${{ vars.PAYABLE_REMINDER_DAYS || '5' }}
          RECEIVABLE_REMINDER_DAYS: ${{ vars.RECEIVABLE_REMINDER_DAYS || '3' }}
          AUTO_SEND_CUSTOMER_EMAILS: ${{ vars.AUTO_SEND_CUSTOMER_EMAILS || 'false' }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ORGANIZATION_ID: ${{ vars.ORGANIZATION_ID }}
          LOCATION_ID: ${{ vars.LOCATION_ID }}

      - name: Upload automation output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aurawash-automation-output
          path: |
            automation/inbox-documents.json
            automation/reminder-log.json
            automation/documents
          if-no-files-found: ignore
